<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commodore 64</title>
<link rel="stylesheet" href="../emulatorjs/data/emulator.css">
<style>
  html, body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #game { width:100vw; height:100vh; }
</style>
</head>
<body>
<div id="game"></div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const rom = q.get('rom');
  if (!rom) { document.body.textContent = 'No PRG supplied'; return; }
  window.EJS_player = '#game';
  window.EJS_core = 'c64';
  window.EJS_gameUrl = rom;
  window.EJS_gameName = q.get('name') || 'game';
  window.EJS_pathtodata = '../emulatorjs/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_disableDatabases = true;
  window.EJS_language = 'en-US';
  /* The C64 runtime reads the KERNAL keyboard (cursor/WASD/Return/Space),
   * not a joystick, so forward the host keyboard straight to the core. */
  window.EJS_defaultOptions = {
    keyboardInput: 'enabled',
    vice_physical_keyboard_pass_through: 'enabled'
  };
})();
</script>
<script src="../emulatorjs/data/loader.js"></script>
</body>
</html>
