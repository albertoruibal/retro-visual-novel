<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Visual Novel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="player" id="player" hidden>
  <header class="topbar">
    <h1 id="title" class="title"></h1>
    <div id="variants" class="variants" hidden>
      <label for="variantpick">Variant</label>
      <select id="variantpick"></select>
    </div>
  </header>
  <main class="stage">
    <div class="screenwrap">
      <div id="screen" class="screen"></div>
      <div id="boot" class="boot" aria-live="polite">
        <strong id="boottitle">Loading…</strong>
        <span id="bootcopy"></span>
      </div>
    </div>
    <aside class="panel">
      <div class="deck" id="deck" data-media="web" aria-label="Media">
        <div class="deck-media" aria-hidden="true">
          <svg class="media-art media-tape" viewBox="0 0 120 76" focusable="false">
            <rect class="media-shell" x="3" y="3" width="114" height="70" rx="8"/>
            <rect class="media-face" x="12" y="10" width="96" height="38" rx="4"/>
            <circle class="media-reel" cx="41" cy="29" r="13"/>
            <circle class="media-reel" cx="79" cy="29" r="13"/>
            <circle class="media-hub" cx="41" cy="29" r="4"/>
            <circle class="media-hub" cx="79" cy="29" r="4"/>
            <rect class="media-detail" x="30" y="55" width="60" height="10" rx="3"/>
            <circle class="media-detail" cx="20" cy="60" r="2.5"/>
            <circle class="media-detail" cx="100" cy="60" r="2.5"/>
          </svg>
          <svg class="media-art media-disk" viewBox="0 0 120 76" focusable="false">
            <rect class="media-shell" x="18" y="3" width="84" height="70" rx="5"/>
            <rect class="media-face" x="34" y="3" width="40" height="27" rx="2"/>
            <rect class="media-shutter" x="66" y="18" width="14" height="12" rx="1"/>
            <rect class="media-face" x="27" y="40" width="66" height="27" rx="2"/>
            <rect class="media-detail" x="34" y="47" width="52" height="3" rx="1.5"/>
            <rect class="media-detail" x="34" y="54" width="38" height="3" rx="1.5"/>
          </svg>
          <svg class="media-art media-cartridge" viewBox="0 0 120 76" focusable="false">
            <rect class="media-shell" x="10" y="6" width="100" height="63" rx="7"/>
            <rect class="media-face" x="19" y="15" width="82" height="33" rx="3"/>
            <rect class="media-detail" x="27" y="24" width="40" height="4" rx="2"/>
            <rect class="media-detail" x="27" y="33" width="56" height="4" rx="2"/>
            <rect class="media-shutter" x="26" y="60" width="68" height="9" rx="2"/>
          </svg>
          <svg class="media-art media-web" viewBox="0 0 120 76" focusable="false">
            <rect class="media-shell" x="9" y="7" width="102" height="62" rx="7"/>
            <line class="media-rule" x1="9" y1="24" x2="111" y2="24"/>
            <circle class="media-detail" cx="20" cy="16" r="2.3"/>
            <circle class="media-detail" cx="28" cy="16" r="2.3"/>
            <circle class="media-detail" cx="36" cy="16" r="2.3"/>
            <rect class="media-face" x="21" y="32" width="46" height="7" rx="3.5"/>
            <rect class="media-detail" x="21" y="45" width="66" height="4" rx="2"/>
            <rect class="media-detail" x="21" y="54" width="52" height="4" rx="2"/>
          </svg>
        </div>
        <div class="deck-meta">
          <span class="deck-label">Media</span>
          <strong id="deck-media-name">Web</strong>
        </div>
        <span class="deck-led" aria-hidden="true"></span>
      </div>
      <div class="systemgroup">
        <span class="systemhead">System</span>
        <div id="systems" class="systems" role="group" aria-label="System"></div>
      </div>
      <div class="panelhead">
        <span id="systemlabel" class="systemlabel"></span>
        <span id="status" class="status"></span>
      </div>
      <p id="hint" class="hint"></p>
      <div class="actions">
        <button id="reload" class="button ghost" type="button">Reload</button>
        <button id="fullscreen" class="button ghost" type="button">Fullscreen</button>
      </div>
      <p class="keys">
        Cursor keys or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move,
        <kbd>Enter</kbd> confirms. <span id="webtap" hidden>The Web version also supports tap and click.</span>
      </p>
    </aside>
  </main>
</div>
<div id="fatal" class="fatal" hidden></div>
<noscript>This player needs JavaScript.</noscript>
<script src="player-data.js"></script>
<script src="player.js"></script>
</body>
</html>
