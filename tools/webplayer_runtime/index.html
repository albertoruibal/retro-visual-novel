<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Visual Novel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="player" id="player" hidden>
  <header class="topbar">
    <h1 id="title" class="title"></h1>
    <div id="systems" class="systems" role="group" aria-label="System"></div>
  </header>
  <main class="stage">
    <div class="screenwrap">
      <div id="screen" class="screen"></div>
      <div id="boot" class="boot" aria-live="polite">
        <strong id="boottitle">Loading…</strong>
        <span id="bootcopy"></span>
      </div>
    </div>
    <aside class="panel">
      <div class="panelhead">
        <span id="systemlabel" class="systemlabel"></span>
        <span id="status" class="status"></span>
      </div>
      <p id="hint" class="hint"></p>
      <div class="actions">
        <a id="download" class="button ghost" download hidden></a>
        <button id="reload" class="button ghost" type="button">Reload</button>
        <button id="fullscreen" class="button ghost" type="button">Fullscreen</button>
      </div>
      <p class="keys">
        Cursor keys or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move,
        <kbd>Enter</kbd> confirms. The Web version also supports tap and click.
      </p>
    </aside>
  </main>
</div>
<div id="fatal" class="fatal" hidden></div>
<noscript>This player needs JavaScript.</noscript>
<script src="player-data.js"></script>
<script src="player.js"></script>
</body>
</html>
