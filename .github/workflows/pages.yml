name: Deploy web player

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build every demo variant and the web player
        env:
          Z88DK_IMAGE: z88dk/z88dk:latest@sha256:2922a2a794494fbcb43d56de7022dc898a6bbe6bc2859409d0b00e4be57da9e4
        run: |
          docker build --build-arg Z88DK_IMAGE="$Z88DK_IMAGE" -t rvn-editor tools/editor
          variants=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import gamestore; print(' '.join(v['id'] for v in gamestore.variant_files('demo-game')))")
          for variant in $variants; do
            docker run --rm -v "$PWD:/src" -w /src rvn-editor \
              python3 tools/build.py build demo-game --variant "$variant"
          done

      - name: Check the exported player
        run: test -f demo-game/web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the player
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-game/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
