# cc65 linker configuration for the banked NES runtime.
#
# Bank 0 ($8000-$BFFF) is switchable and holds the story/art blobs (RODATA).
# The last 16KB bank is fixed by MMC1 mode 3 at $C000-$FFFF and holds all code,
# the NMI/vector table.  Song streams live
# in the PRG banks between bank 0 and the fixed bank; tools/targets/nes.py
# assembles them after this linker image.
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0300; # 3 pages stack
}
MEMORY {
    ZP:      file = "", start = $0002, size = $001E, type = rw, define = yes;

    # INES Cartridge Header
    HEADER:  file = %O, start = $0000, size = $0010, fill = yes;

    # Switchable 16K story/art bank at $8000
    ROM0:    file = %O, start = $8000, size = $4000, fill = yes, define = yes;

    # Fixed last 16K bank: all code, the NMI and the vector tail
    ROMFIX:  file = %O, start = $C000, size = $3FFA, fill = yes, define = yes;

    # Hardware Vectors at the end of the fixed bank
    ROMV:    file = %O, start = $FFFA, size = $0006, fill = yes;

    # 8K CHR font bank emitted by cc65 (the target replaces it with generated
    # per-art CHR banks)
    ROM2:    file = %O, start = $0000, size = $2000, fill = yes;

    SRAM:    file = "", start = $0500, size = __STACKSIZE__, define = yes;

    # 8K PRG RAM: data, bss, heap
    RAM:     file = "", start = $6000, size = $2000, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    HEADER:   load = HEADER,  type = ro;
    STARTUP:  load = ROMFIX,  type = ro, define = yes;
    LOWCODE:  load = ROMFIX,  type = ro, optional = yes;
    ONCE:     load = ROMFIX,  type = ro, optional = yes;
    CODE:     load = ROMFIX,  type = ro, define = yes;
    RODATA:   load = ROM0,    type = ro, define = yes;
    DATA:     load = ROMFIX,  run = RAM, type = rw, define = yes;
    VECTORS:  load = ROMV,    type = rw;
    CHARS:    load = ROM2,    type = rw;
    BSS:      load = RAM,     type = bss, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
